name: Complete jsPDF upgrade

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-lock-and-validate:
    if: github.event.pull_request.head.ref == 'agent/update-jspdf-4-2-0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-jspdf-4-2-0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Migrate remaining jsPDF imports
        run: |
          sed -i 's/import jsPDF from "jspdf"/import { jsPDF } from "jspdf"/' src/pages/EBDRelatorios.jsx
          sed -i 's/import autoTable from "jspdf-autotable"/import { autoTable } from "jspdf-autotable"/' src/pages/EBDRelatorios.jsx

      - name: Install dependencies and regenerate lockfile
        run: npm install

      - name: Validate dependency tree
        run: npm ls jspdf jspdf-autotable

      - name: Build application
        run: npm run build

      - name: Remove temporary workflow and commit generated files
        run: |
          rm .github/workflows/complete-jspdf-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/pages/EBDRelatorios.jsx .github/workflows/complete-jspdf-upgrade.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Conclui migração para jsPDF 4.2.0"
            git push origin HEAD:agent/update-jspdf-4-2-0
          fi
